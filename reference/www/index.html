		<script>
			// Oracle input shim (UI-tour harness). OracleShell's scripted taps
			// dispatch untrusted PointerEvents(pointerType:'touch') + TouchEvents,
			// which the game's UI gesture layer ignores; its mouse handler
			// (mousedown/mouseup on window) does respond to a real click. Translate
			// each scripted tap into the same pointer+mouse sequence a real click
			// produces, and swallow the original touch/pointer events so they cannot
			// double-fire. Only untrusted touch events are affected — real user
			// input and the port code are untouched.
			(function () {
				"use strict";
				var pending = null;
				function fireMouse(x, y) {
					var t = document.getElementById("gfx") || document;
					var base = { bubbles: true, cancelable: true, clientX: x, clientY: y };
					var mo = Object.assign(
						{ pointerId: 7, pointerType: "mouse", isPrimary: true, button: 0 }, base);
					t.dispatchEvent(new PointerEvent("pointermove", Object.assign({ buttons: 0 }, mo)));
					t.dispatchEvent(new MouseEvent("mousemove", Object.assign({ buttons: 0 }, base)));
					t.dispatchEvent(new PointerEvent("pointerdown", Object.assign({ buttons: 1 }, mo)));
					t.dispatchEvent(new MouseEvent("mousedown", Object.assign({ buttons: 1 }, base)));
					setTimeout(function () {
						t.dispatchEvent(new PointerEvent("pointerup", Object.assign({ buttons: 0 }, mo)));
						t.dispatchEvent(new MouseEvent("mouseup", Object.assign({ buttons: 0 }, base)));
						t.dispatchEvent(new MouseEvent("click", base));
					}, 90);
				}
				window.addEventListener("pointerdown", function (e) {
					if (e.isTrusted !== false || e.pointerType !== "touch") return;
					pending = { x: e.clientX, y: e.clientY };
					e.stopImmediatePropagation();
					e.preventDefault();
				}, true);
				window.addEventListener("touchstart", function (e) {
					if (e.isTrusted !== false) return;
					if (e.changedTouches && e.changedTouches.length) {
						pending = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
					}
					e.stopImmediatePropagation();
					e.preventDefault();
				}, true);
				window.addEventListener("pointerup", function (e) {
					if (e.isTrusted !== false || e.pointerType !== "touch") return;
					e.stopImmediatePropagation();
					e.preventDefault();
					if (pending) {
						var p = pending;
						pending = null;
						fireMouse(p.x, p.y);
					}
				}, true);
				window.addEventListener("touchend", function (e) {
					if (e.isTrusted !== false) return;
					e.stopImmediatePropagation();
					e.preventDefault();
				}, true);
				window.addEventListener("touchcancel", function (e) {
					if (e.isTrusted !== false) return;
					e.stopImmediatePropagation();
					e.preventDefault();
				}, true);
			})();
			document.addEventListener("contextmenu", (event) => event.preventDefault());
			document.addEventListener("dragstart", (event) => event.preventDefault());

				document.getElementById("runtime-fallback").classList.add("is-visible");

					return false;

					showRuntimeFallback();
				});
			}
		</script>
