<!DOCTYPE html>
<html lang="en">
	<head>
		<script src="./microsite-game-interface.js"></script>
		<title>Shadow Fight 2</title>
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1, width=device-width, interactive-widget=resizes-content">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<link rel="icon" type="image/png" href="favicon.7fe3f2b1.ico">
		<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.df79ae0d.png">
		<style>
			body {
				margin: 0px;
				overflow: hidden;
				background-color: black;
			}
			.runtime-fallback {
				display: none;
				box-sizing: border-box;
				width: 100%;
				height: 100%;
				padding: clamp(24px, 6vw, 72px);
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #f5f5f5;
				background:
					radial-gradient(circle at 50% 0%, rgba(86, 75, 56, .36), transparent 45%),
					#070707;
			}
			.runtime-fallback.is-visible {
				display: grid;
				place-items: center;
			}
			.runtime-fallback__panel {
				width: min(680px, 100%);
				padding: clamp(24px, 5vw, 48px);
				border: 1px solid rgba(255, 255, 255, .16);
				border-radius: 18px;
				background: rgba(20, 20, 20, .88);
				box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
			}
			.runtime-fallback h1 {
				margin: 0 0 12px;
				font-size: clamp(26px, 5vw, 42px);
				line-height: 1.05;
			}
			.runtime-fallback p {
				margin: 12px 0;
				color: #c5c5c5;
				line-height: 1.6;
			}
		</style>
	</head>
	<body>
		<main class="runtime-fallback" id="runtime-fallback" aria-live="polite">
			<section class="runtime-fallback__panel">
				<h1>WebGL2 is required</h1>
				<p>
					The Shadow Fight 2 runtime has started, but this browser
					cannot create a WebGL2 rendering context. The game needs hardware-accelerated
					WebGL2 to draw its canvas.
				</p>
				<p>
					Open this page in a browser with hardware acceleration enabled.
				</p>
			</section>
		</main>
		<script>
			document.addEventListener("contextmenu", (event) => event.preventDefault());
			document.addEventListener("dragstart", (event) => event.preventDefault());

			function showRuntimeFallback() {
				document.getElementById("runtime-fallback").classList.add("is-visible");
			}

			function supportsWebGL2() {
				try {
					const canvas = document.createElement("canvas");
					return Boolean(canvas.getContext("webgl2", { stencil: true }));
				} catch (error) {
					return false;
				}
			}

			if (!supportsWebGL2()) {
				showRuntimeFallback();
			} else {
				window.GameInterface.init([
					"fflate.4d6ec944.js",
					"imageloader.665d5d2b.js",
					"sf2.502f0946.js",
					"trace.js"
				]).then(() => SF2.main()).catch((error) => {
					console.error("Unable to boot the game runtime", error);
					showRuntimeFallback();
				});
			}
		</script>
	</body>
</html>
