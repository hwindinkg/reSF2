name: Apply main.cpp fix

on:
  workflow_dispatch:
  push:
    branches: [ci/linux-build-check]
    paths: ['.github/workflows/apply-mainfix.yml']

permissions:
  contents: write

concurrency:
  group: apply-mainfix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Show g++
        run: g++ --version

      - name: Apply patches
        run: |
          python3 - <<'PY'
          import re, sys
          p = "main.cpp"
          s = open(p, encoding="utf-8").read()
          def sub_once(pat, repl, s, flags=0):
              s2, n = re.subn(pat, repl, s, count=0, flags=flags)
              if n != 1:
                  print(f"PATCH FAIL: matched {n}x: {pat[:70]}")
                  sys.exit(2)
              return s2
          s = sub_once(
              r'if \(cur_kc == 1 \|\| cur_kc == 2\) \{',
              'if ((cur_kc == 1 || cur_kc == 2) && hit_anim_ > 0 &&\n'
              '                                current_anim_ != "stance_idle" && current_anim_ != "fists_idle" &&\n'
              '                                current_anim_ != "step_forward" && current_anim_ != "step_back") {',
              s)
          s = sub_once(
              r'std::printf\("\[ROOT\] anim=\x27%s\x27 first frame:.*?anim_facing_right_\);',
              'std::printf("[ROOT] anim=\x27%s\x27 first frame: frame=%d player=(%.1f,%.1f) '
              'npivot=(%.1f,%.1f) render_y=%.1f facing=%d\\n",\n'
              '                            current_anim_.c_str(), frame_idx, player_pos_x_, player_pos_y_,\n'
              '                            npivot_x, npivot_y, player_pos_y_ + y_adjust_smoothed_, anim_facing_right_);',
              s, flags=re.DOTALL)
          s = sub_once(
              r'y_adjust_smoothed_ = FEET_FLOOR_OFFSET;',
              'y_adjust_smoothed_ = FEET_FLOOR_OFFSET;\n'
              '        { static bool warned_yadj = false; if (!warned_yadj) { warned_yadj = true;\n'
              '            std::fprintf(stderr, "[HEURISTIC-TODO] y_adjust is a constant FEET_FLOOR_OFFSET: '
              'grounds standing/crouch/jump but floats rolls ~84px. Needs per-move contact/pivot (MoveInside). See HANDOFF.md\\n"); } }',
              s)
          open(p, "w", encoding="utf-8").write(s)
          print("PATCH OK")
          PY

      - name: Syntax-check main.cpp
        run: |
          set +e
          g++ -std=c++23 -fsyntax-only main.cpp -I. \
            -Wno-old-style-cast -Wno-conversion -Wno-unused-parameter \
            > /tmp/tu.log 2>&1
          echo "tu_rc=$?" | tee /tmp/tu_rc.txt
          tail -c 40000 /tmp/tu.log
          set -e

      - name: Commit on main base, force-push to ci branch
        run: |
          rc=$(grep -o '[0-9]*' /tmp/tu_rc.txt | head -1)
          if [ "$rc" != "0" ]; then echo "syntax failed"; exit 1; fi
          git config user.name "reSF2 ci"
          git config user.email "ci@resf2.local"
          git add main.cpp
          git commit -m "fix(main): stale current_move_ guard + extended [ROOT] diag log + y_adjust heuristic warning [HEURISTIC-TODO]" || { echo "no change"; exit 1; }
          git push --force origin HEAD:ci/linux-build-check
          echo "FORCE-PUSHED main+patch to ci/linux-build-check"
          git rev-parse HEAD | tee /tmp/newsha.txt
