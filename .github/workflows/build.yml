name: Build & Release

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake build-essential \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev \
            libwayland-dev libxkbcommon-dev

      - name: Apply draw-order fix (JS fidelity patch)
        run: python3 scripts/fix_draw_order.py

      - name: Apply compile compatibility fixes (fopen_s -> std::fopen for Linux GCC)
        run: python3 scripts/fix_compile.py

      - name: Apply visual correctness fixes (parallax factor 0->1 + ASTC mips==0)
        run: python3 scripts/fix_visuals.py

      - name: Apply R2 two-camera fix (fight floor vertical framing)
        run: python3 scripts/fix_r2.py

      - name: Apply R3 capsule disc-cap ends fix
        run: python3 scripts/fix_r3.py

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build game target
        run: cmake --build build --config Release --target game -j$(nproc)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-linux-${{ github.sha }}
          path: build/app/game/game
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/game/game
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
