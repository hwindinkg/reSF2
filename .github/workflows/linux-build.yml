name: reSF2 Linux Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build xorg-dev libgl1-mesa-dev zlib1g-dev
          cmake --version
          g++ --version

      - name: Configure (CMake)
        id: configure
        run: |
          mkdir -p docs/_ci_logs
          set +e
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRESF2_BUILD_RUNTIME=ON \
            -DRESF2_USE_GLFW=ON \
            -DRESF2_BUILD_TESTS=ON \
            -DRESF2_BUILD_TOOLS=OFF \
            -DGLFW_BUILD_WAYLAND=OFF \
            -DGLFW_BUILD_X11=ON \
            > docs/_ci_logs/configure.log 2>&1
          echo "configure_rc=$?" | tee docs/_ci_logs/configure_rc.txt
          tail -c 60000 docs/_ci_logs/configure.log
          set -e

      - name: Build
        id: build
        run: |
          set +e
          cmake --build build --parallel > docs/_ci_logs/build.log 2>&1
          echo "build_rc=$?" | tee docs/_ci_logs/build_rc.txt
          tail -c 200000 docs/_ci_logs/build.log
          set -e

      - name: Tests (ctest)
        id: ctest
        run: |
          set +e
          ctest --test-dir build --output-on-failure > docs/_ci_logs/ctest.log 2>&1
          echo "ctest_rc=$?" | tee docs/_ci_logs/ctest_rc.txt
          tail -c 40000 docs/_ci_logs/ctest.log
          set -e

      - name: Fail job if build broke
        run: |
          cfg=$(cat docs/_ci_logs/configure_rc.txt | grep -o '[0-9]*')
          bld=$(cat docs/_ci_logs/build_rc.txt | grep -o '[0-9]*')
          echo "configure_rc=$cfg build_rc=$bld"
          test "$cfg" = "0" && test "$bld" = "0"

      - name: Commit logs
        if: always()
        run: |
          git config user.name "reSF2 ci"
          git config user.email "ci@resf2.local"
          git add docs/_ci_logs
          git commit -m "ci: build logs [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ci/linux-build-check || true
          git push origin HEAD:ci/linux-build-check || true
